name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Run Regression Tests
        run: dotnet run --project tests/MioReel.RegressionTests/MioReel.RegressionTests.csproj

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Install Linux NativeAOT Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libx11-dev libice-dev libsm-dev libfontconfig1-dev

      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish NativeAOT (${{ matrix.rid }})
        run: >
          dotnet publish src/MioReel.Desktop/MioReel.Desktop.csproj
          -c Release
          -f net10.0
          -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Package Windows Archive
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath "MioReel-$tag-win-x64.zip" -Force

      - name: Package Linux Archive
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          chmod +x publish/linux-x64/MioReel.Desktop
          tar -czf "MioReel-${{ steps.ver.outputs.tag }}-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: MioReel-*-${{ matrix.rid }}.${{ matrix.archive_ext }}

  android-tv:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish Android TV APK
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $code = "${{ github.run_number }}"
          if ($env:KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes("$PWD\release.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            ./scripts/publish-android-tv.ps1 -VersionName $version -VersionCode $code `
              -KeystorePath .\release.keystore `
              -KeystorePassword $env:KEYSTORE_PASSWORD `
              -KeyAlias $env:KEY_ALIAS `
              -KeyPassword $env:KEY_PASSWORD
          } else {
            ./scripts/publish-android-tv.ps1 -VersionName $version -VersionCode $code
          }
          Copy-Item `
            src/MioReel.Desktop/bin/Release/net10.0-android36.0/publish/com.mioreel.tv-Signed.apk `
            "MioReel-${{ steps.ver.outputs.tag }}-android-tv-armeabi-v7a.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-android-tv
          path: MioReel-*-android-tv-armeabi-v7a.apk

  release:
    needs: [publish, android-tv]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve Tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" artifacts/* \
            --title "妙妙短剧 $TAG" \
            --generate-notes \
            --verify-tag || gh release upload "$TAG" artifacts/* --clobber
